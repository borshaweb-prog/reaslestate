<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inquiries Admin</title><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="shell"><aside><b>BORSHA GADGETS</b><a href="index.html">Overview</a><a href="properties.html">Properties</a><a class="active" href="inquiries.html">Inquiries</a><a href="agents.html">Agents</a><a href="settings.html">Settings</a></aside><main><div class="eyebrow">LEAD MANAGEMENT</div><h1>Inquiries</h1><section class="panel"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Message</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><script>let a=JSON.parse(localStorage.getItem('borsha_inquiries')||'[]');document.querySelector('#rows').innerHTML=a.length?a.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.email}</td><td>${x.message||'—'}</td><td>${new Date(x.date).toLocaleDateString()}</td></tr>`).join(''):'<tr><td colspan="5">No inquiries yet.</td></tr>'</script></body></html>
