name: Verify SQL Schema

on:
  push:
    paths:
      - "database/schema.sql"
      - ".github/workflows/sql-verify.yml"
  pull_request:
    paths:
      - "database/schema.sql"
      - ".github/workflows/sql-verify.yml"

jobs:
  sqlite-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and execute schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path("database/schema.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(sql)

          expected = {
              "properties": 12,
              "agents": 3,
              "reviews": 8,
          }
          for table, count in expected.items():
              actual = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              assert actual == count, f"{table}: expected {count}, got {actual}"

          print("SQL syntax + schema execution: PASS")
          print("Seed counts:", expected)
          PY